name: Practice curriculum maintenance
on:
  push:
    branches: [codex/practice-bank-maintenance]
    paths: ['scripts/practice-maintenance/**', '.github/workflows/practice-maintenance.yml']
permissions:
  contents: read
concurrency:
  group: practice-curriculum-maintenance
  cancel-in-progress: false
jobs:
  curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify correction plan
        run: node --test scripts/practice-maintenance/plan.test.mjs
      - name: Require deployed overwrite protection and corrected marking
        run: |
          node --input-type=module -e "const r = await fetch('https://amalschool.org/api/runtime/version'); const data = await r.json(); if (data.version !== 'e835e1520d6e831e3214a74d45d2d40dbceab811') throw new Error('Expected application release is not live'); console.log('Verified application release');"
      - name: Apply and read back reviewed corrections
        run: node scripts/practice-maintenance/apply-plan.mjs --apply
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice-correction-backup
          path: practice-maintenance-backup.json
          retention-days: 3
