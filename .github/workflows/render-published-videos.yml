name: Render published lesson videos

on:
  workflow_dispatch:
    inputs:
      shard:
        description: Stable lesson shard as INDEX/TOTAL
        required: false
        default: "0/1"
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: render-published-lesson-videos-${{ inputs.shard || 'scheduled' }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AMAL_SITE_URL: https://amalschool.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render missing or stale published lesson videos
        env:
          RENDER_SHARD: ${{ inputs.shard || '0/1' }}
        run: npm run render:published -- --shard="$RENDER_SHARD"
